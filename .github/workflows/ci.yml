name: Build and test

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: 6.10.2
  CYRUS_VERSION: 2.1.28
  CYRUS_REVISION: r1
  CYRUS_TAG: deps-cyrus-sasl-2.1.28-r1
  ANDROID_NDK_VERSION: r27c

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libssl-dev libsasl2-dev
      - run: |
          cmake -S . -B build -G Ninja \
            -DBUILD_WITH_QT6=ON -DBUILD_PLUGINS='ossl;cyrus-sasl' \
            -DBUILD_TESTS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            asset: cyrus-sasl-2.1.28-r1-windows-x64.tar.gz
          - os: macos-15
            platform: macos-arm64
            asset: cyrus-sasl-2.1.28-r1-macos-arm64.tar.gz
          - os: macos-15-intel
            platform: macos-x86_64
            asset: cyrus-sasl-2.1.28-r1-macos-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Download static Cyrus SASL bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir cyrus
          gh release download "$CYRUS_TAG" --repo '${{ github.repository }}' -p '${{ matrix.asset }}'
          tar -xzf '${{ matrix.asset }}' -C cyrus
      - name: Install OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install openssl:x64-windows
      - name: Install OpenSSL on macOS
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DBUILD_WITH_QT6=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=ON `
            -DBUILD_PLUGINS="ossl;cyrus-sasl" `
            -DSasl2_ROOT="$pwd/cyrus" -DSASL2_USE_STATIC_LIBS=ON
      - name: Configure macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOSX_FRAMEWORK=OFF \
            -DBUILD_WITH_QT6=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=ON \
            -DBUILD_PLUGINS='ossl;cyrus-sasl' \
            -DSasl2_ROOT="$PWD/cyrus" -DSASL2_USE_STATIC_LIBS=ON
      - run: cmake --build build --config Release
      - name: Verify required plugins were built
        shell: bash
        run: |
          test -n "$(find build -type f -name '*qca-ossl*' -print -quit)"
          test -n "$(find build -type f -name '*qca-cyrus-sasl*' -print -quit)"

  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: armeabi-v7a
            qt_arch: android_armv7
          - abi: x86_64
            qt_arch: android_x86_64
          - abi: x86
            qt_arch: android_x86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Download static Cyrus SASL bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir cyrus
          asset="cyrus-sasl-${CYRUS_VERSION}-${CYRUS_REVISION}-android-${{ matrix.abi }}.tar.gz"
          gh release download "$CYRUS_TAG" --repo '${{ github.repository }}' -p "$asset"
          tar -xzf "$asset" -C cyrus
      - name: Build
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
          "$qt_cmake" -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF \
            -DBUILD_PLUGINS='ossl;cyrus-sasl' \
            -DSasl2_ROOT="$PWD/cyrus" -DSASL2_USE_STATIC_LIBS=ON
          cmake --build build
          test -n "$(find build -type f -name '*qca-ossl*.so' -print -quit)"
          test -n "$(find build -type f -name '*qca-cyrus-sasl*.so' -print -quit)"
