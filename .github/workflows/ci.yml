name: Build and test

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

env:
  CYRUS_VERSION: 2.1.28
  CYRUS_REVISION: r7
  CYRUS_TAG: deps-cyrus-sasl-2.1.28-r7
  ANDROID_NDK_VERSION: r27c
  ANDROID_API: 28

jobs:
  dependency_lock:
    name: Qt6 dependency lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: qt
        uses: ./.github/actions/load-dependency-lock
      - name: Verify locked Qt version
        shell: bash
        run: test -n "${{ steps.qt.outputs.qt_version }}"

  ensure_cyrus_bundles:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deps-cyrus-sasl.yml
    with:
      include_android_x86: false
    permissions:
      contents: write

  check_cyrus_bundles_pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify prebuilt Cyrus SASL dependency bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=(
            "cyrus-sasl-${CYRUS_VERSION}-${CYRUS_REVISION}-windows-x64.tar.gz"
            "cyrus-sasl-${CYRUS_VERSION}-${CYRUS_REVISION}-macos-arm64.tar.gz"
            "cyrus-sasl-${CYRUS_VERSION}-${CYRUS_REVISION}-macos-x86_64.tar.gz"
            "cyrus-sasl-${CYRUS_VERSION}-${CYRUS_REVISION}-android-arm64-v8a.tar.gz"
            "cyrus-sasl-${CYRUS_VERSION}-${CYRUS_REVISION}-android-x86_64.tar.gz"
          )
          if ! gh release view "$CYRUS_TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "::error::Required dependency release '$CYRUS_TAG' does not exist yet. Merge/run CI on the trusted branch once so it can bootstrap the dependency bundles."
            exit 1
          fi
          assets=$(gh release view "$CYRUS_TAG" --repo '${{ github.repository }}' --json assets --jq '.assets[].name')
          missing=0
          for asset in "${expected[@]}"; do
            if ! grep -Fxq "$asset" <<<"$assets"; then
              echo "::error::Missing Cyrus SASL dependency asset: $asset"
              missing=1
            fi
          done
          exit "$missing"

  cyrus_ready:
    if: always()
    needs: [ensure_cyrus_bundles, check_cyrus_bundles_pr]
    runs-on: ubuntu-latest
    steps:
      - name: Require Cyrus dependency preparation
        shell: bash
        env:
          ENSURE_RESULT: ${{ needs.ensure_cyrus_bundles.result }}
          CHECK_RESULT: ${{ needs.check_cyrus_bundles_pr.result }}
        run: |
          if [[ "$ENSURE_RESULT" == success || "$CHECK_RESULT" == success ]]; then
            exit 0
          fi
          echo "::error::Cyrus SASL dependency bundles are not available."
          exit 1

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build qt6-base-dev libssl-dev libsasl2-dev \
            libsasl2-modules libsasl2-modules-db sasl2-bin
      - name: Configure Ubuntu Cyrus SASL SCRAM fixture
        shell: bash
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/qca-scram-sasldb2"
          sudo mkdir -p /etc/sasl2
          cat <<EOF | sudo tee /etc/sasl2/qca.conf
          pwcheck_method: auxprop
          auxprop_plugin: sasldb
          sasldb_path: $db
          mech_list: SCRAM-SHA-256
          EOF
          printf '%s' 'pencil' | sudo saslpasswd2 -p -c -f "$db" -u example.test qca-scram-user
          sudo chmod 0644 "$db"
          sasldblistusers2 -f "$db"
          dpkg -L libsasl2-modules | grep -E '/libscram\.so'
      - run: |
          cmake -S . -B build -G Ninja \
            -DBUILD_WITH_QT6=ON -DBUILD_PLUGINS='ossl;cyrus-sasl' \
            -DBUILD_TESTS=ON
      - run: cmake --build build
      - name: Run Ubuntu 24.04 tests with SCRAM required
        env:
          QCA_SASL_TEST_ENABLE: '1'
        run: ctest --test-dir build --output-on-failure

  linux-sasl-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build qt6-base-dev libssl-dev libsasl2-dev \
            libsasl2-modules libsasl2-modules-db sasl2-bin
      - name: Configure Ubuntu Cyrus SASL SCRAM fixture
        shell: bash
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/qca-scram-sasldb2"
          sudo mkdir -p /etc/sasl2
          cat <<EOF | sudo tee /etc/sasl2/qca.conf
          pwcheck_method: auxprop
          auxprop_plugin: sasldb
          sasldb_path: $db
          mech_list: SCRAM-SHA-256
          EOF
          printf '%s' 'pencil' | sudo saslpasswd2 -p -c -f "$db" -u example.test qca-scram-user
          sudo chmod 0644 "$db"
          sasldblistusers2 -f "$db"
          dpkg -L libsasl2-modules | grep -E '/libscram\.so'
      - name: Configure QCA with AddressSanitizer
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS='-fsanitize=address -fno-omit-frame-pointer' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address' \
            -DBUILD_WITH_QT6=ON -DBUILD_PLUGINS='ossl;cyrus-sasl' \
            -DBUILD_TESTS=ON
      - run: cmake --build build-asan --parallel 2
      - name: Run Cyrus SASL regressions under AddressSanitizer
        env:
          ASAN_OPTIONS: 'detect_leaks=0:abort_on_error=1'
          QCA_SASL_TEST_ENABLE: '1'
        run: ctest --test-dir build-asan -R Sasl --output-on-failure

      - name: Run OpenSSL ownership regression under LeakSanitizer
        env:
          ASAN_OPTIONS: 'detect_leaks=1:abort_on_error=1'
        run: |
          build-asan/bin/dtlssrtpunittest repeatedCertificateAndHandshakeLifetime

  windows-native-crypto:
    name: Windows CNG without OpenSSL (shared=${{ matrix.shared }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shared: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: qt
        uses: ./.github/actions/load-dependency-lock
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.qt.outputs.qt_version }}
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure native CNG and SSPI providers
        shell: pwsh
        run: >-
          cmake -S . -B native-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/native-sdk
          -DBUILD_WITH_QT6=ON -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          "-DBUILD_PLUGINS=wincrypto;wingss" -DBUILD_TESTS=ON -DBUILD_TOOLS=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE
      - name: Build and exercise native crypto and TLS
        shell: pwsh
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          cmake --build native-build --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir native-build --output-on-failure --timeout 60 -R '^(WinCrypto.*|WinGss\..*|DTLSSRTP|Hashing|SymmetricCipher|MessageAuthenticationCode|KeyDerivationFunction|SaslScram|SaslChannelBinding|SecureFile\..*)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # CTest hides the status logged by a successful handshake test.
          # Run this fixture directly to retain the Schannel status in CI.
          $env:QCA_PLUGIN_PATH = "$pwd/native-build/lib/qca3-qt6"
          & "$pwd/native-build/bin/wincryptotlsunittest.exe" optionalClientCertificateRequest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install native-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-qt5:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up MSYS2 MINGW64 Qt5
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # MINGW64/Qt5 is intentionally retained for the Windows 7 baseline.
          suppress-deprecation-warnings: msystem-mingw64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-openssl
      - name: Verify Windows 7 target baseline
        shell: msys2 {0}
        run: |
          set -euo pipefail
          macros=$(printf '#include <windows.h>\n' | \
            gcc -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 -dM -E -x c -)
          grep -Eq '^#define _WIN32_WINNT 0x0601([[:space:]]|$)' <<< "$macros"
          grep -Eq '^#define WINVER 0x0601([[:space:]]|$)' <<< "$macros"
      - name: Configure QCA3 Qt5
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdk" \
            -DCMAKE_C_FLAGS='-D_WIN32_WINNT=0x0601 -DWINVER=0x0601' \
            -DCMAKE_CXX_FLAGS='-D_WIN32_WINNT=0x0601 -DWINVER=0x0601' \
            -DBUILD_WITH_QT6=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_TOOLS=OFF \
            -DBUILD_PLUGINS='ossl;wincrypto;wingss' \
            -DWINCRYPTO_TEST_OPENSSL_INTEROP=ON \
            -DLOAD_SHARED_PLUGINS=ON \
            -DQCA_SUFFIX=qt5 \
            -DUSE_RELATIVE_PATHS=ON
      - name: Build and test QCA3 Qt5
        shell: msys2 {0}
        run: |
          set -euo pipefail
          trap 'echo "::error::Line $LINENO failed: $BASH_COMMAND"' ERR
          # Without a console window, Qt on Windows sends test output to
          # OutputDebugString instead of stdout.
          export QT_FORCE_STDERR_LOGGING=1
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          # The tests run every algorithm on every loaded provider, where
          # qca-ossl covers everything. Run them again with qca-wincrypto
          # alone, before the install puts plugins on QCA's default path.
          plugin="$(find build/lib -type f -iname '*qca-wincrypto*.dll' -print -quit)"
          test -n "$plugin" || { echo "::error::qca-wincrypto DLL not found under build/lib"; exit 1; }
          mkdir -p wincrypto-only/crypto
          cp "$plugin" wincrypto-only/crypto/
          export QCA_PLUGIN_PATH="$(cygpath -m "$PWD/wincrypto-only")"
          failed=0
          for test in hashunittest kdfunittest cipherunittest; do
            status=0
            out="$(cd build/bin && "./$test.exe" 2>&1 | tr -d '\r')" || status=$?
            problem=""
            if [ "$status" != 0 ]; then
              problem="exit status $status"
            elif ! grep -q '"qca-wincrypto"' <<< "$out"; then
              problem="qca-wincrypto not loaded"
            elif grep -q '"qca-ossl"' <<< "$out"; then
              problem="qca-ossl loaded too"
            elif grep -qE 'NONE of the providers supports (MD5|SHA1|SHA256|SHA384|SHA512|PBKDF version 2|HKDF|AES)' <<< "$out"; then
              problem="an algorithm of qca-wincrypto reported as unsupported"
            fi
            if [ -z "$problem" ]; then
              grep -E '^Totals' <<< "$out" || true
              continue
            fi
            failed=1
            echo "$out"
            # One annotation per test, as annotations stay readable through
            # the API where the raw log may not be.
            details="$(grep -E 'FAIL!|Loc:|Actual|Expected|NONE of the providers supports|^Totals' <<< "$out" | head -n 80 || true)"
            [ -n "$details" ] || details="$(tail -n 40 <<< "$out")"
            details="$problem"$'\n'"$details"
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            # The title is a property: no ':' or ',' in it.
            echo "::error title=$test with qca-wincrypto alone::$details"
          done
          unset QCA_PLUGIN_PATH
          test "$failed" = 0
          cmake --install build
          test -f sdk/lib/cmake/Qca3-qt5/Qca3-qt5Config.cmake
          test -f sdk/include/Qca3-qt5/QtCrypto/qca_securefile.h
          test -n "$(find sdk/bin -type f -iname '*qca3-qt5*.dll' -print -quit)"
          test -n "$(find sdk -type f -iname '*qca-ossl*.dll' -print -quit)"
          test -n "$(find sdk -type f -iname '*qca-wincrypto*.dll' -print -quit)"
          test -n "$(find sdk -type f -iname '*qca-wingss*.dll' -print -quit)"
      - name: Verify relocated QCA3 Qt5 SDK consumer
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mv sdk relocated-sdk
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(qca_consumer LANGUAGES CXX)
          find_package(Qca3-qt5 CONFIG REQUIRED)
          add_executable(qca-consumer main.cpp)
          target_link_libraries(qca-consumer PRIVATE Qca3::Qca)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <QtCrypto>
          int main()
          {
              QCA::Initializer init;
              QCA::SecureFile file(QStringLiteral("unused"));
              return file.maximumSize() > 0 ? 0 : 1;
          }
          CPP
          cmake -S consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$PWD/relocated-sdk;/mingw64" \
            "-DQca3-qt5_DIR=$PWD/relocated-sdk/lib/cmake/Qca3-qt5"
          cmake --build consumer-build --parallel 2
          PATH="$PWD/relocated-sdk/bin:/mingw64/bin:$PATH" ./consumer-build/qca-consumer.exe
          mv relocated-sdk sdk
      - name: Upload QCA3 Qt5 SDK
        uses: actions/upload-artifact@v6
        with:
          name: qca3-qt5-windows-x64
          path: sdk/
          if-no-files-found: error
          retention-days: 14

  desktop:
    if: always() && needs.cyrus_ready.result == 'success'
    needs: cyrus_ready
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Load locked Qt6 SDK version
        id: dependency_lock
        uses: ./.github/actions/load-dependency-lock
      - uses: ./.github/actions/build-qca-desktop
        with:
          qt-version: ${{ steps.dependency_lock.outputs.qt_version }}
          platform: ${{ matrix.platform }}
          cyrus-version: ${{ env.CYRUS_VERSION }}
          cyrus-revision: ${{ env.CYRUS_REVISION }}
          cyrus-tag: ${{ env.CYRUS_TAG }}
          install-prefix: ${{ github.workspace }}/sdk
      - name: Verify required plugins were built
        shell: bash
        run: |
          test -n "$(find build -type f -name '*qca-ossl*' -print -quit)"
          test -n "$(find build -type f -name '*qca-cyrus-sasl*' -print -quit)"
          if [ "$RUNNER_OS" = Windows ]; then
            test -n "$(find build -type f -name '*qca-wincrypto*' -print -quit)"
            test -n "$(find build -type f -name '*qca-wingss*' -print -quit)"
          fi
      - name: Verify SCRAM exchanges with the bundled Cyrus library
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DBUILD_TESTS=ON
          cmake --build build --config Release --target kdfunittest saslchannelbindingunittest
          if [[ "$RUNNER_OS" == Windows ]]; then
            export PATH="$(cygpath -u "$QT_ROOT_DIR")/bin:$PWD/build/bin/Release:$PWD/build/lib/Release:$PWD/sdk/bin:$PATH"
            # Visual Studio places modules in crypto/Release; QCA searches
            # crypto directly. Exercise only the native crypto and SASL modules.
            cp build/lib/qca3-qt6/crypto/Release/qca-{wincrypto,cyrus-sasl,wingss}.dll build/lib/qca3-qt6/crypto/
            cmake --build build --config Release --target wingssunit wingssproviderunit
          elif [[ "$RUNNER_OS" == macOS ]]; then
            export DYLD_FRAMEWORK_PATH="$QT_ROOT_DIR/lib:${DYLD_FRAMEWORK_PATH:-}"
            export DYLD_LIBRARY_PATH="$PWD/build/lib:${DYLD_LIBRARY_PATH:-}"
          fi
          export QT_FORCE_STDERR_LOGGING=1
          ctest --test-dir build -C Release -R '^(KeyDerivationFunction|SaslChannelBinding|WinGss\..*)$' -V | tee sasl-tests.log
          # Optional-provider tests normally skip missing mechanisms. These
          # bundles promise SCRAM, so require actual successful exchanges.
          for row in sha1-plus sha256-plus sha384-plus sha512-plus sha256-plus-interactive sha256-plus-bad-signature; do
            grep -F "PASS   : SaslChannelBindingUnitTest::completeClient($row)" sasl-tests.log
            if [[ "$RUNNER_OS" == Windows ]]; then
              grep -F "PASS   : SaslChannelBindingUnitTest::completeClient(wingss-$row)" sasl-tests.log
            fi
          done
      - name: Install and relocate SDK
        shell: bash
        run: |
          cmake --install build --config Release
          mv sdk relocated-sdk
      - name: Prepare relocated SDK consumer
        shell: bash
        run: |
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(qca_consumer LANGUAGES CXX)
          find_package(Qca3-qt6 CONFIG REQUIRED)
          add_executable(qca-consumer main.cpp)
          target_link_libraries(qca-consumer PRIVATE Qca3::Qca)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <QtCrypto>
          int main() { QCA::Initializer init; return 0; }
          CPP
      - name: Compile and run relocated SDK consumer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qcaDir = Join-Path $pwd 'relocated-sdk\lib\cmake\Qca3-qt6'
          cmake -S consumer -B consumer-build `
            "-DQca3-qt6_DIR=$qcaDir" `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build consumer-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$pwd\relocated-sdk\bin;$env:QT_ROOT_DIR\bin;$env:PATH"
          & "$pwd\consumer-build\Release\qca-consumer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and run relocated SDK consumer on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DQca3-qt6_DIR=$PWD/relocated-sdk/lib/cmake/Qca3-qt6" \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
          cmake --build consumer-build
          DYLD_LIBRARY_PATH="$PWD/relocated-sdk/lib:${DYLD_LIBRARY_PATH:-}" ./consumer-build/qca-consumer

  android:
    if: always() && needs.cyrus_ready.result == 'success'
    needs: cyrus_ready
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: x86_64
            qt_arch: android_x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Load locked Qt6 SDK version
        id: dependency_lock
        uses: ./.github/actions/load-dependency-lock
      - uses: ./.github/actions/build-qca-android
        with:
          qt-version: ${{ steps.dependency_lock.outputs.qt_version }}
          qt-arch: ${{ matrix.qt_arch }}
          abi: ${{ matrix.abi }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          android-api: ${{ env.ANDROID_API }}
          cyrus-version: ${{ env.CYRUS_VERSION }}
          cyrus-revision: ${{ env.CYRUS_REVISION }}
          cyrus-tag: ${{ env.CYRUS_TAG }}
          install-prefix: ${{ github.workspace }}/sdk
      - name: Verify required plugins were built
        shell: bash
        run: |
          test -n "$(find build -type f -name '*qca-ossl*.so' -print -quit)"
          test -n "$(find build -type f -name '*qca-cyrus-sasl*.so' -print -quit)"
      - name: Install and relocate SDK
        shell: bash
        run: |
          cmake --install build
          mv sdk relocated-sdk
      - name: Compile relocated SDK consumer
        shell: bash
        run: |
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(qca_consumer LANGUAGES CXX)
          find_package(Qca3-qt6 CONFIG REQUIRED)
          add_library(qca-consumer SHARED main.cpp)
          target_link_libraries(qca-consumer PRIVATE Qca3::Qca)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <QtCrypto>
          extern "C" int qca_consumer_smoke()
          {
              QCA::Initializer init;
              return 0;
          }
          CPP
          qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
          test -n "$qt_cmake"
          "$qt_cmake" -S consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            "-DQca3-qt6_DIR=$PWD/relocated-sdk/lib/cmake/Qca3-qt6"
          cmake --build consumer-build
