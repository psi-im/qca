name: Retag broken QCA v3.0.1 release

on:
  push:
    branches: [ master ]

permissions:
  actions: write
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move v3.0.1 and rebuild release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v3.0.1
          OLD_SHA: c3730523abbd20486a1f200f92c302822d454f2b
          TARGET_SHA: 648971209efde3a9ffa29839626955cd201a5e1b
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          current=$(git rev-list -n1 "$TAG")
          echo "$TAG currently points to $current"

          if [[ "$current" == "$TARGET_SHA" ]]; then
            echo "$TAG is already at the intended commit; nothing to do"
            exit 0
          fi
          if [[ "$current" != "$OLD_SHA" ]]; then
            echo "::error::$TAG unexpectedly points to $current instead of $OLD_SHA; refusing to move it"
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Deleting broken GitHub Release for $TAG"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

          git tag -f "$TAG" "$TARGET_SHA"
          git push --force origin "refs/tags/$TAG"

          moved=$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')
          if [[ "$moved" != "$TARGET_SHA" ]]; then
            echo "::error::$TAG moved to unexpected SHA $moved"
            exit 1
          fi

          echo "Dispatching the normal release workflow for rebuilt $TAG assets"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref master -f tag="$TAG"
