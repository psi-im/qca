name: Dispatch QCA v3.1.0 release
# One-shot release initiator. Existing release.yml validates and publishes SDKs.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release-v3.1.0-dispatch.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the exact validated WinCrypto commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=3723935c5a2d46da339db457128d21c567ae8bc1
          git cat-file -e "$expected^{commit}"
          git merge-base --is-ancestor "$expected" HEAD
          # Verify the source commit is the latest validated master build.
          run_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$expected&per_page=25" \
            --jq '[.workflow_runs[] | select(.name == "Build and test" and .conclusion == "success")] | length')
          test "$run_sha" -ge 1 || {
            echo "::error::No successful Build and test run found for $expected"
            exit 1
          }
          git fetch --force --tags origin
          if git rev-parse -q --verify 'refs/tags/v3.1.0' >/dev/null; then
            test "$(git rev-list -n1 v3.1.0)" = "$expected" || {
              echo "::error::Existing v3.1.0 points to another commit"
              exit 1
            }
          else
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git tag -a v3.1.0 "$expected" -m "QCA 3.1.0: native Windows CNG and WinCrypto"
            git push origin refs/tags/v3.1.0
          fi
      - name: Dispatch the existing QCA release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref master --repo "$GITHUB_REPOSITORY" -f tag=v3.1.0
          echo "Started QCA 3.1.0 release packaging and publication."
