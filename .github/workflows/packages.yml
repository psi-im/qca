name: QCA3 packages

on:
  workflow_dispatch:
  push:
    tags: [ 'v3*' ]

env:
  QT_VERSION: 6.10.2
  CYRUS_VERSION: 2.1.28
  CYRUS_REVISION: r5
  CYRUS_TAG: deps-cyrus-sasl-2.1.28-r5
  ANDROID_NDK_VERSION: r27c
  ANDROID_API: 28

jobs:
  ensure_cyrus_bundles:
    uses: ./.github/workflows/deps-cyrus-sasl.yml
    permissions:
      contents: write

  debian:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: qca3-deb-ubuntu-24.04
          - os: ubuntu-26.04
            artifact: qca3-deb-ubuntu-26.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils cmake file ninja-build qt6-base-dev libssl-dev libsasl2-dev dpkg-dev
      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_WITH_QT6=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=ON \
            -DBUILD_PLUGINS='ossl;cyrus-sasl'
          cmake --build build
          DESTDIR="$PWD/stage" cmake --install build
          test -n "$(find stage -type f -name '*qca-ossl*.so*' -print -quit)"
          test -n "$(find stage -type f -name '*qca-cyrus-sasl*.so*' -print -quit)"
      - name: Build split deb packages
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(qca VERSION \([^)]*\)).*/\1/p' CMakeLists.txt)
          arch=$(dpkg --print-architecture)
          mkdir -p debs debug-debs work/{runtime,dev,plugins,utils} debug-work/{runtime,plugins,utils}
          while IFS= read -r -d '' f; do
            rel=${f#stage/}
            case "$rel" in
              */qca3-qt6/crypto/*) dst=plugins ;;
              usr/include/*|*/cmake/*|*/pkgconfig/*|*.so) dst=dev ;;
              usr/bin/*|usr/share/man/*) dst=utils ;;
              *) dst=runtime ;;
            esac
            mkdir -p "work/$dst/$(dirname "$rel")"
            cp -a "$f" "work/$dst/$rel"
          done < <(find stage \( -type f -o -type l \) -print0)
          make_deb() {
            dir=$1 pkg=$2 depends=$3 desc=$4
            mkdir -p "$dir/DEBIAN"
            cat > "$dir/DEBIAN/control" <<CTRL
          Package: $pkg
          Version: $version
          Architecture: $arch
          Maintainer: Psi IM developers
          Depends: $depends
          Section: libs
          Priority: optional
          Description: $desc
          CTRL
            dpkg-deb --build --root-owner-group "$dir" "debs/${pkg}_${version}_${arch}.deb"
          }
          make_debug_deb() {
            dir=$1 pkg=$2 depends=$3 desc=$4
            mkdir -p "$dir/DEBIAN"
            cat > "$dir/DEBIAN/control" <<CTRL
          Package: $pkg
          Version: $version
          Architecture: $arch
          Maintainer: Psi IM developers
          Depends: $depends
          Section: debug
          Priority: optional
          Description: $desc
          CTRL
            dpkg-deb --build --root-owner-group "$dir" "debug-debs/${pkg}_${version}_${arch}.deb"
          }
          extract_debug_symbols() {
            dir=$1 debug_dir=$2
            while IFS= read -r -d '' binary; do
              if ! file "$binary" | grep -q 'ELF'; then
                continue
              fi
              build_id=$(readelf -n "$binary" | awk '/Build ID:/ {print $3}')
              if [[ -z "$build_id" ]]; then
                echo "ELF binary has no build ID: $binary" >&2
                exit 1
              fi
              debug="$debug_dir/usr/lib/debug/.build-id/${build_id:0:2}/${build_id:2}.debug"
              mkdir -p "$(dirname "$debug")"
              objcopy --only-keep-debug "$binary" "$debug"
              strip --strip-unneeded "$binary"
              test -s "$debug"
              if readelf -S "$binary" | grep -q '\.debug_'; then
                echo "Debug sections remain after stripping: $binary" >&2
                exit 1
              fi
            done < <(find "$dir" -type f -print0)
          }

          extract_debug_symbols work/runtime debug-work/runtime
          extract_debug_symbols work/plugins debug-work/plugins
          extract_debug_symbols work/utils debug-work/utils
          test -n "$(find debug-work -type f -name '*.debug' -print -quit)"

          make_deb work/runtime libqca3-qt6-3 'libqt6core6t64, libc6, libstdc++6, libgcc-s1' 'QCA3 Qt6 runtime library'
          make_deb work/plugins libqca3-qt6-plugins 'libqca3-qt6-3, libssl3t64, libsasl2-2' 'QCA3 Qt6 crypto plugins'
          make_deb work/dev libqca3-qt6-dev 'libqca3-qt6-3, qt6-base-dev' 'QCA3 Qt6 development files'
          make_deb work/utils qca3-qt6-utils 'libqca3-qt6-3' 'QCA3 Qt6 command line utilities'
          make_debug_deb debug-work/runtime libqca3-qt6-3-dbgsym "libqca3-qt6-3 (= $version)" 'QCA3 Qt6 runtime debug symbols'
          make_debug_deb debug-work/plugins libqca3-qt6-plugins-dbgsym "libqca3-qt6-plugins (= $version)" 'QCA3 Qt6 crypto plugins debug symbols'
          make_debug_deb debug-work/utils qca3-qt6-utils-dbgsym "qca3-qt6-utils (= $version)" 'QCA3 Qt6 utilities debug symbols'
          ls -l debs debug-debs
      - name: Install package smoke test
        run: sudo apt-get install -y ./debs/*.deb
      - name: Compile installed CMake consumer
        shell: bash
        run: |
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(qca_consumer LANGUAGES CXX)
          find_package(Qca3-qt6 CONFIG REQUIRED)
          add_executable(qca-consumer main.cpp)
          target_link_libraries(qca-consumer PRIVATE Qca3::Qca)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <QtCrypto>
          int main() { QCA::Initializer init; return 0; }
          CPP
          cmake -S consumer -B consumer-build -G Ninja
          cmake --build consumer-build
          ./consumer-build/qca-consumer
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: debs/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-symbols
          path: debug-debs/*.deb
          if-no-files-found: error

  desktop-sdk:
    needs: ensure_cyrus_bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-qca-desktop
        with:
          qt-version: ${{ env.QT_VERSION }}
          platform: ${{ matrix.platform }}
          cyrus-version: ${{ env.CYRUS_VERSION }}
          cyrus-revision: ${{ env.CYRUS_REVISION }}
          cyrus-tag: ${{ env.CYRUS_TAG }}
          install-prefix: ${{ github.workspace }}/sdk
          build-type: RelWithDebInfo
      - run: cmake --install build --config RelWithDebInfo
      - name: Install bundled Cyrus SASL license
        shell: bash
        run: |
          mkdir -p sdk/share/licenses/qca3/cyrus-sasl
          cp cyrus/licenses/COPYING sdk/share/licenses/qca3/cyrus-sasl/COPYING
      - name: Verify required plugins
        shell: bash
        run: |
          test -n "$(find sdk -type f \( -name '*qca-ossl*' -o -name '*qca-ossl*.dylib' \) -print -quit)"
          test -n "$(find sdk -type f \( -name '*qca-cyrus-sasl*' -o -name '*qca-cyrus-sasl*.dylib' \) -print -quit)"
      - name: Verify Cyrus SASL is not a desktop runtime dependency
        if: runner.os == 'macOS'
        shell: bash
        run: |
          plugin=$(find sdk -type f -name '*qca-cyrus-sasl*.dylib' -print -quit)
          test -n "$plugin"
          if otool -L "$plugin" | grep -Ei 'libsasl|sasl2'; then
            echo 'qca-cyrus-sasl unexpectedly depends on shared Cyrus SASL' >&2
            exit 1
          fi
      - name: Verify Cyrus SASL is not a Windows runtime dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $plugin = Get-ChildItem sdk -Recurse -File | Where-Object { $_.Name -like '*qca-cyrus-sasl*.dll' } | Select-Object -First 1
          if (-not $plugin) { throw 'qca-cyrus-sasl DLL not found' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found' }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ tools not found' }
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -File -Filter dumpbin.exe |
            Where-Object { $_.FullName -match '\\bin\\Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw 'x64 dumpbin.exe not found' }

          $deps = (& $dumpbin.FullName /DEPENDENTS $plugin.FullName) | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
          Write-Host $deps
          if ($deps -match '(?i)(libsasl|sasl2).*\.dll') { throw 'qca-cyrus-sasl unexpectedly depends on shared Cyrus SASL' }
      - name: Extract desktop debug symbols and strip SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf symbols
          mkdir -p symbols

          if [ "$RUNNER_OS" = "Windows" ]; then
            while IFS= read -r -d '' pdb; do
              rel=${pdb#build/}
              mkdir -p "symbols/build/$(dirname "$rel")"
              cp "$pdb" "symbols/build/$rel"
            done < <(find build -type f -iname '*.pdb' -print0)
            while IFS= read -r -d '' pdb; do
              rel=${pdb#sdk/}
              mkdir -p "symbols/installed/$(dirname "$rel")"
              cp "$pdb" "symbols/installed/$rel"
            done < <(find sdk -type f -iname '*.pdb' -print0)
            find sdk -type f -iname '*.pdb' -delete
            test -n "$(find symbols -type f -iname '*.pdb' -print -quit)"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            while IFS= read -r -d '' binary; do
              if file "$binary" | grep -q 'Mach-O'; then
                rel=${binary#sdk/}
                dsym="symbols/${rel}.dSYM"
                mkdir -p "$(dirname "$dsym")"
                dsymutil "$binary" -o "$dsym"
                strip -S "$binary"
              fi
            done < <(find sdk -type f -print0)
            test -n "$(find symbols -type d -name '*.dSYM' -print -quit)"
          else
            echo "Unsupported desktop runner: $RUNNER_OS" >&2
            exit 1
          fi

      - name: Relocate SDK and prepare consumer
        shell: bash
        run: |
          mv sdk relocated-sdk
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(qca_consumer LANGUAGES CXX)
          find_package(Qca3-qt6 CONFIG REQUIRED)
          add_executable(qca-consumer main.cpp)
          target_link_libraries(qca-consumer PRIVATE Qca3::Qca)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <QtCrypto>
          int main() { QCA::Initializer init; return 0; }
          CPP
      - name: Compile and run relocated consumer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qcaDir = Join-Path $pwd 'relocated-sdk\lib\cmake\Qca3-qt6'
          cmake -S consumer -B consumer-build `
            "-DQca3-qt6_DIR=$qcaDir" `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build consumer-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$pwd\relocated-sdk\bin;$env:QT_ROOT_DIR\bin;$env:PATH"
          & "$pwd\consumer-build\Release\qca-consumer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and run relocated consumer on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DQca3-qt6_DIR=$PWD/relocated-sdk/lib/cmake/Qca3-qt6" \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
          cmake --build consumer-build
          DYLD_LIBRARY_PATH="$PWD/relocated-sdk/lib:${DYLD_LIBRARY_PATH:-}" ./consumer-build/qca-consumer
      - name: Restore SDK artifact path
        shell: bash
        run: mv relocated-sdk sdk
      - uses: actions/upload-artifact@v4
        with:
          name: qca3-qt6-${{ matrix.platform }}
          path: sdk/
      - uses: actions/upload-artifact@v4
        with:
          name: qca3-qt6-${{ matrix.platform }}-symbols
          path: symbols/
          if-no-files-found: error

  android-sdk:
    needs: ensure_cyrus_bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: x86_64
            qt_arch: android_x86_64
          - abi: x86
            qt_arch: android_x86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-qca-android
        id: build-qca
        with:
          qt-version: ${{ env.QT_VERSION }}
          qt-arch: ${{ matrix.qt_arch }}
          abi: ${{ matrix.abi }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          android-api: ${{ env.ANDROID_API }}
          cyrus-version: ${{ env.CYRUS_VERSION }}
          cyrus-revision: ${{ env.CYRUS_REVISION }}
          cyrus-tag: ${{ env.CYRUS_TAG }}
          install-prefix: ${{ github.workspace }}/sdk
          build-type: RelWithDebInfo
      - name: Install and verify SDK
        shell: bash
        run: |
          cmake --install build
          mkdir -p sdk/share/licenses/qca3/cyrus-sasl
          cp cyrus/licenses/COPYING sdk/share/licenses/qca3/cyrus-sasl/COPYING
          test -n "$(find sdk -type f -name '*qca-ossl*.so' -print -quit)"
          cyrus_plugin=$(find sdk -type f -name '*qca-cyrus-sasl*.so' -print -quit)
          test -n "$cyrus_plugin"
          if readelf -d "$cyrus_plugin" | grep NEEDED | grep -Ei 'libsasl|sasl2'; then
            echo 'qca-cyrus-sasl unexpectedly depends on shared Cyrus SASL' >&2
            exit 1
          fi
      - name: Extract Android debug symbols and strip SDK
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.build-qca.outputs.ndk-path }}
        run: |
          set -euo pipefail
          toolchain_bin="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          llvm_objcopy="$toolchain_bin/llvm-objcopy"
          llvm_strip="$toolchain_bin/llvm-strip"
          test -x "$llvm_objcopy"
          test -x "$llvm_strip"

          rm -rf symbols
          mkdir -p symbols
          while IFS= read -r -d '' lib; do
            rel=${lib#sdk/}
            debug="symbols/${rel}.debug"
            mkdir -p "$(dirname "$debug")"
            "$llvm_objcopy" --only-keep-debug "$lib" "$debug"
            "$llvm_strip" --strip-unneeded "$lib"
            "$llvm_objcopy" --add-gnu-debuglink="$debug" "$lib"
            test -s "$debug"
            if readelf -S "$lib" | grep -q '\.debug_'; then
              echo "Debug sections remain after stripping: $lib" >&2
              exit 1
            fi
          done < <(find sdk -type f \( -name '*.so' -o -name '*.so.*' \) -print0)
          test -n "$(find symbols -type f -name '*.debug' -print -quit)"

      - name: Compile consumer after relocating SDK
        shell: bash
        run: |
          mv sdk relocated-sdk
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(qca_consumer LANGUAGES CXX)
          find_package(Qca3-qt6 CONFIG REQUIRED)
          add_library(qca-consumer SHARED main.cpp)
          target_link_libraries(qca-consumer PRIVATE Qca3::Qca)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <QtCrypto>
          extern "C" int qca_consumer_smoke()
          {
              QCA::Initializer init;
              return 0;
          }
          CPP
          qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
          test -n "$qt_cmake"
          "$qt_cmake" -S consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            "-DQca3-qt6_DIR=$PWD/relocated-sdk/lib/cmake/Qca3-qt6"
          cmake --build consumer-build
          mv relocated-sdk sdk
      - uses: actions/upload-artifact@v4
        with:
          name: qca3-qt6-android-${{ matrix.abi }}
          path: sdk/
      - uses: actions/upload-artifact@v4
        with:
          name: qca3-qt6-android-${{ matrix.abi }}-symbols
          path: symbols/
          if-no-files-found: error
