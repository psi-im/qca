name: QCA3 packages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to package; defaults to the selected workflow ref
        required: false
        type: string
      debian_only:
        description: Build only Debian packages
        required: false
        default: false
        type: boolean
  push:
    tags: [ 'v3*' ]

env:
  QT_VERSION: 6.10.2
  CYRUS_VERSION: 2.1.28
  CYRUS_REVISION: r5
  CYRUS_TAG: deps-cyrus-sasl-2.1.28-r5
  ANDROID_NDK_VERSION: r27c
  ANDROID_API: 28

jobs:
  ensure_cyrus_bundles:
    if: ${{ !inputs.debian_only }}
    uses: ./.github/workflows/deps-cyrus-sasl.yml
    permissions:
      contents: write

  ubuntu:
    if: ${{ !inputs.debian_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: qca3-deb-ubuntu-24.04
          - os: ubuntu-26.04
            artifact: qca3-deb-ubuntu-26.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - name: Build, package and smoke-test QCA
        uses: ./.github/actions/build-qca-deb
        with:
          artifact: ${{ matrix.artifact }}

  debian:
    name: Debian 13 (amd64)
    runs-on: ubuntu-24.04
    # Use Google's Docker Hub cache to avoid anonymous pull limits on runners.
    container: mirror.gcr.io/library/debian:13-slim
    steps:
      - name: Bootstrap Debian build tools
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=2 -o APT::Update::Error-Mode=any update
          apt-get install -y --no-install-recommends ca-certificates git sudo build-essential gh
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - name: Trust container checkout for Git version detection
        shell: bash
        run: |
          # checkout sets safe.directory in a temporary HOME. Subsequent
          # container steps need the exception in their own Git configuration.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout packaging workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: packaging-workflow
      - name: Build, package and smoke-test QCA
        uses: ./packaging-workflow/.github/actions/build-qca-deb
        with:
          artifact: qca3-deb-debian-13
          source-ref: ${{ inputs.source_ref || github.ref_name }}

  windows-qt5-sdk:
    if: ${{ !inputs.debian_only }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - name: Set up MSYS2 MINGW64 Qt5
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-openssl
      - name: Verify Windows 7 target baseline
        shell: msys2 {0}
        run: |
          set -euo pipefail
          macros=$(printf '#include <windows.h>\n' | \
            gcc -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 -dM -E -x c -)
          grep -Eq '^#define _WIN32_WINNT 0x0601([[:space:]]|$)' <<< "$macros"
          grep -Eq '^#define WINVER 0x0601([[:space:]]|$)' <<< "$macros"
      - name: Configure QCA3 Qt5
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdk" \
            -DCMAKE_C_FLAGS='-D_WIN32_WINNT=0x0601 -DWINVER=0x0601' \
            -DCMAKE_CXX_FLAGS='-D_WIN32_WINNT=0x0601 -DWINVER=0x0601' \
            -DBUILD_WITH_QT6=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_TOOLS=OFF \
            -DBUILD_PLUGINS=ossl \
            -DLOAD_SHARED_PLUGINS=ON \
            -DQCA_SUFFIX=qt5 \
            -DUSE_RELATIVE_PATHS=ON
      - name: Build, test, and install QCA3 Qt5
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          cmake --install build
          test -f sdk/lib/cmake/Qca3-qt5/Qca3-qt5Config.cmake
          test -f sdk/include/Qca3-qt5/QtCrypto/qca_securefile.h
          test -n "$(find sdk/bin -type f -iname '*qca3-qt5*.dll' -print -quit)"
          test -n "$(find sdk -type f -iname '*qca-ossl*.dll' -print -quit)"
      - name: Verify relocated QCA3 Qt5 SDK consumer
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mv sdk relocated-sdk
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(qca_consumer LANGUAGES CXX)
          find_package(Qca3-qt5 CONFIG REQUIRED)
          add_executable(qca-consumer main.cpp)
          target_link_libraries(qca-consumer PRIVATE Qca3::Qca)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <QtCrypto>
          int main()
          {
              QCA::Initializer init;
              QCA::SecureFile file(QStringLiteral("unused"));
              return file.maximumSize() > 0 ? 0 : 1;
          }
          CPP
          cmake -S consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$PWD/relocated-sdk;/mingw64" \
            "-DQca3-qt5_DIR=$PWD/relocated-sdk/lib/cmake/Qca3-qt5"
          cmake --build consumer-build --parallel 2
          PATH="$PWD/relocated-sdk/bin:/mingw64/bin:$PATH" ./consumer-build/qca-consumer.exe
          mv relocated-sdk sdk
      - uses: actions/upload-artifact@v4
        with:
          name: qca3-qt5-windows-x64
          path: sdk/
          if-no-files-found: error

  desktop-sdk:
    if: ${{ !inputs.debian_only }}
    needs: ensure_cyrus_bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/build-qca-desktop
        with:
          qt-version: ${{ env.QT_VERSION }}
          platform: ${{ matrix.platform }}
          cyrus-version: ${{ env.CYRUS_VERSION }}
          cyrus-revision: ${{ env.CYRUS_REVISION }}
          cyrus-tag: ${{ env.CYRUS_TAG }}
          install-prefix: ${{ github.workspace }}/sdk
          build-type: RelWithDebInfo
      - run: cmake --install build --config RelWithDebInfo
      - name: Install bundled Cyrus SASL license
        shell: bash
        run: |
          mkdir -p sdk/share/licenses/qca3/cyrus-sasl
          cp cyrus/licenses/COPYING sdk/share/licenses/qca3/cyrus-sasl/COPYING
      - name: Verify required plugins
        shell: bash
        run: |
          test -n "$(find sdk -type f \( -name '*qca-ossl*' -o -name '*qca-ossl*.dylib' \) -print -quit)"
          test -n "$(find sdk -type f \( -name '*qca-cyrus-sasl*' -o -name '*qca-cyrus-sasl*.dylib' \) -print -quit)"
      - name: Verify Cyrus SASL is not a desktop runtime dependency
        if: runner.os == 'macOS'
        shell: bash
        run: |
          plugin=$(find sdk -type f -name '*qca-cyrus-sasl*.dylib' -print -quit)
          test -n "$plugin"
          if otool -L "$plugin" | grep -Ei 'libsasl|sasl2'; then
            echo 'qca-cyrus-sasl unexpectedly depends on shared Cyrus SASL' >&2
            exit 1
          fi
      - name: Verify Cyrus SASL is not a Windows runtime dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $plugin = Get-ChildItem sdk -Recurse -File | Where-Object { $_.Name -like '*qca-cyrus-sasl*.dll' } | Select-Object -First 1
          if (-not $plugin) { throw 'qca-cyrus-sasl DLL not found' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found' }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ tools not found' }
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -File -Filter dumpbin.exe |
            Where-Object { $_.FullName -match '\\bin\\Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw 'x64 dumpbin.exe not found' }

          $deps = (& $dumpbin.FullName /DEPENDENTS $plugin.FullName) | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
          Write-Host $deps
          if ($deps -match '(?i)(libsasl|sasl2).*\.dll') { throw 'qca-cyrus-sasl unexpectedly depends on shared Cyrus SASL' }
      - name: Extract desktop debug symbols and strip SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf symbols
          mkdir -p symbols

          if [ "$RUNNER_OS" = "Windows" ]; then
            while IFS= read -r -d '' pdb; do
              rel=${pdb#build/}
              mkdir -p "symbols/build/$(dirname "$rel")"
              cp "$pdb" "symbols/build/$rel"
            done < <(find build -type f -iname '*.pdb' -print0)
            while IFS= read -r -d '' pdb; do
              rel=${pdb#sdk/}
              mkdir -p "symbols/installed/$(dirname "$rel")"
              cp "$pdb" "symbols/installed/$rel"
            done < <(find sdk -type f -iname '*.pdb' -print0)
            find sdk -type f -iname '*.pdb' -delete
            test -n "$(find symbols -type f -iname '*.pdb' -print -quit)"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            while IFS= read -r -d '' binary; do
              if file "$binary" | grep -q 'Mach-O'; then
                rel=${binary#sdk/}
                dsym="symbols/${rel}.dSYM"
                mkdir -p "$(dirname "$dsym")"
                dsymutil "$binary" -o "$dsym"
                strip -S "$binary"
              fi
            done < <(find sdk -type f -print0)
            test -n "$(find symbols -type d -name '*.dSYM' -print -quit)"
          else
            echo "Unsupported desktop runner: $RUNNER_OS" >&2
            exit 1
          fi

      - name: Relocate SDK and prepare consumer
        shell: bash
        run: |
          mv sdk relocated-sdk
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(qca_consumer LANGUAGES CXX)
          find_package(Qca3-qt6 CONFIG REQUIRED)
          add_executable(qca-consumer main.cpp)
          target_link_libraries(qca-consumer PRIVATE Qca3::Qca)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <QtCrypto>
          int main() { QCA::Initializer init; return 0; }
          CPP
      - name: Compile and run relocated consumer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qcaDir = Join-Path $pwd 'relocated-sdk\lib\cmake\Qca3-qt6'
          cmake -S consumer -B consumer-build `
            "-DQca3-qt6_DIR=$qcaDir" `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build consumer-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$pwd\relocated-sdk\bin;$env:QT_ROOT_DIR\bin;$env:PATH"
          & "$pwd\consumer-build\Release\qca-consumer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and run relocated consumer on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DQca3-qt6_DIR=$PWD/relocated-sdk/lib/cmake/Qca3-qt6" \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
          cmake --build consumer-build
          DYLD_LIBRARY_PATH="$PWD/relocated-sdk/lib:${DYLD_LIBRARY_PATH:-}" ./consumer-build/qca-consumer
      - name: Restore SDK artifact path
        shell: bash
        run: mv relocated-sdk sdk
      - uses: actions/upload-artifact@v4
        with:
          name: qca3-qt6-${{ matrix.platform }}
          path: sdk/
      - uses: actions/upload-artifact@v4
        with:
          name: qca3-qt6-${{ matrix.platform }}-symbols
          path: symbols/
          if-no-files-found: error

  android-sdk:
    if: ${{ !inputs.debian_only }}
    needs: ensure_cyrus_bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: x86_64
            qt_arch: android_x86_64
          - abi: x86
            qt_arch: android_x86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/build-qca-android
        id: build-qca
        with:
          qt-version: ${{ env.QT_VERSION }}
          qt-arch: ${{ matrix.qt_arch }}
          abi: ${{ matrix.abi }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          android-api: ${{ env.ANDROID_API }}
          cyrus-version: ${{ env.CYRUS_VERSION }}
          cyrus-revision: ${{ env.CYRUS_REVISION }}
          cyrus-tag: ${{ env.CYRUS_TAG }}
          install-prefix: ${{ github.workspace }}/sdk
          build-type: RelWithDebInfo
      - name: Install and verify SDK
        shell: bash
        run: |
          cmake --install build
          mkdir -p sdk/share/licenses/qca3/cyrus-sasl
          cp cyrus/licenses/COPYING sdk/share/licenses/qca3/cyrus-sasl/COPYING
          test -n "$(find sdk -type f -name '*qca-ossl*.so' -print -quit)"
          cyrus_plugin=$(find sdk -type f -name '*qca-cyrus-sasl*.so' -print -quit)
          test -n "$cyrus_plugin"
          if readelf -d "$cyrus_plugin" | grep NEEDED | grep -Ei 'libsasl|sasl2'; then
            echo 'qca-cyrus-sasl unexpectedly depends on shared Cyrus SASL' >&2
            exit 1
          fi
      - name: Extract Android debug symbols and strip SDK
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.build-qca.outputs.ndk-path }}
        run: |
          set -euo pipefail
          toolchain_bin="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          llvm_objcopy="$toolchain_bin/llvm-objcopy"
          llvm_strip="$toolchain_bin/llvm-strip"
          test -x "$llvm_objcopy"
          test -x "$llvm_strip"

          rm -rf symbols
          mkdir -p symbols
          while IFS= read -r -d '' lib; do
            rel=${lib#sdk/}
            debug="symbols/${rel}.debug"
            mkdir -p "$(dirname "$debug")"
            "$llvm_objcopy" --only-keep-debug "$lib" "$debug"
            "$llvm_strip" --strip-unneeded "$lib"
            "$llvm_objcopy" --add-gnu-debuglink="$debug" "$lib"
            test -s "$debug"
            if readelf -S "$lib" | grep -q '\.debug_'; then
              echo "Debug sections remain after stripping: $lib" >&2
              exit 1
            fi
          done < <(find sdk -type f \( -name '*.so' -o -name '*.so.*' \) -print0)
          test -n "$(find symbols -type f -name '*.debug' -print -quit)"

      - name: Compile consumer after relocating SDK
        shell: bash
        run: |
          mv sdk relocated-sdk
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(qca_consumer LANGUAGES CXX)
          find_package(Qca3-qt6 CONFIG REQUIRED)
          add_library(qca-consumer SHARED main.cpp)
          target_link_libraries(qca-consumer PRIVATE Qca3::Qca)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <QtCrypto>
          extern "C" int qca_consumer_smoke()
          {
              QCA::Initializer init;
              return 0;
          }
          CPP
          qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
          test -n "$qt_cmake"
          "$qt_cmake" -S consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            "-DQca3-qt6_DIR=$PWD/relocated-sdk/lib/cmake/Qca3-qt6"
          cmake --build consumer-build
          mv relocated-sdk sdk
      - uses: actions/upload-artifact@v4
        with:
          name: qca3-qt6-android-${{ matrix.abi }}
          path: sdk/
      - uses: actions/upload-artifact@v4
        with:
          name: qca3-qt6-android-${{ matrix.abi }}-symbols
          path: symbols/
          if-no-files-found: error
