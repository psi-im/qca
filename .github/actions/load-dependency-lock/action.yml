name: Read QCA dependency lock
description: Read and validate the pinned Qt6 SDK version from the checked-out source

outputs:
  qt-version:
    description: Exact Qt6 SDK version selected by dependencies.lock.json
    value: ${{ steps.lock.outputs.qt-version }}

runs:
  using: composite
  steps:
    - id: lock
      name: Validate and export Qt6 SDK version
      shell: bash
      run: |
        set -euo pipefail
        qt_version="$(python - <<'PY'
        import json
        import re
        from pathlib import Path

        lock = json.loads(Path("dependencies.lock.json").read_text(encoding="utf-8"))
        qt = lock.get("qt", {})
        version = qt.get("version") if isinstance(qt, dict) else None
        if not isinstance(version, str) or not re.fullmatch(r"6\\.[0-9]+\\.[0-9]+", version):
            raise SystemExit("dependencies.lock.json: qt.version must be a Qt6 patch version (6.x.y)")
        print(version)
        PY
        )"
        echo "qt-version=$qt_version" >> "$GITHUB_OUTPUT"
