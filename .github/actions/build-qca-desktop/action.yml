name: Build QCA for desktop
description: Configure and build QCA with the private static Cyrus SASL bundle

inputs:
  qt-version:
    description: Qt version
    required: true
  platform:
    description: Bundle platform name
    required: true
  cyrus-version:
    description: Cyrus SASL version
    required: true
  cyrus-revision:
    description: Cyrus SASL bundle revision
    required: true
  cyrus-tag:
    description: GitHub release tag containing Cyrus SASL bundles
    required: true
  install-prefix:
    description: CMake install prefix
    required: true

runs:
  using: composite
  steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        cache: true

    - name: Download static Cyrus SASL bundle
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        rm -rf cyrus
        mkdir cyrus
        asset="cyrus-sasl-${{ inputs.cyrus-version }}-${{ inputs.cyrus-revision }}-${{ inputs.platform }}.tar.gz"
        gh release download "${{ inputs.cyrus-tag }}" --repo '${{ github.repository }}' -p "$asset"
        tar -xzf "$asset" -C cyrus

    - name: Resolve Windows vcpkg cache key
      if: runner.os == 'Windows'
      id: vcpkg-cache-key
      shell: pwsh
      run: |
        $vcpkgRevision = (git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD).Trim()
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
        $toolsetFile = Join-Path $vsPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt'
        $toolset = (Get-Content $toolsetFile -Raw).Trim()
        "vcpkg=$vcpkgRevision" >> $env:GITHUB_OUTPUT
        "msvc=$toolset" >> $env:GITHUB_OUTPUT

    - name: Restore Windows vcpkg binary cache
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: qca-vcpkg-openssl-${{ runner.os }}-${{ steps.vcpkg-cache-key.outputs.vcpkg }}-${{ steps.vcpkg-cache-key.outputs.msvc }}-x64-windows-release

    - name: Install OpenSSL on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
        $triplets = Join-Path $pwd '.github\vcpkg\triplets'
        New-Item -ItemType Directory -Force -Path $cache | Out-Null
        $env:VCPKG_BINARY_SOURCES = "clear;files,$cache,readwrite"
        vcpkg install openssl:x64-windows-release --overlay-triplets="$triplets"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Install OpenSSL on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: brew install openssl@3

    - name: Configure Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $triplets = Join-Path $pwd '.github\vcpkg\triplets'
        cmake -S . -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="${{ inputs.install-prefix }}" `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows-release `
          -DVCPKG_OVERLAY_TRIPLETS="$triplets" `
          -DBUILD_WITH_QT6=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=ON `
          -DBUILD_PLUGINS="ossl;cyrus-sasl" `
          -DSasl2_ROOT="$pwd/cyrus" -DSASL2_USE_STATIC_LIBS=ON

    - name: Configure macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="${{ inputs.install-prefix }}" \
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
          -DOSX_FRAMEWORK=OFF \
          -DBUILD_WITH_QT6=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=ON \
          -DBUILD_PLUGINS='ossl;cyrus-sasl' \
          -DSasl2_ROOT="$PWD/cyrus" -DSASL2_USE_STATIC_LIBS=ON

    - name: Build QCA
      shell: bash
      run: cmake --build build --config Release
