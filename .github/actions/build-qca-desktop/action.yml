name: Build QCA for desktop
description: Configure and build QCA with the private static Cyrus SASL bundle

inputs:
  qt-version:
    description: Qt version
    required: true
  platform:
    description: Bundle platform name
    required: true
  cyrus-version:
    description: Cyrus SASL version
    required: true
  cyrus-revision:
    description: Cyrus SASL bundle revision
    required: true
  cyrus-tag:
    description: GitHub release tag containing Cyrus SASL bundles
    required: true
  install-prefix:
    description: CMake install prefix
    required: true

runs:
  using: composite
  steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        cache: true

    - name: Download static Cyrus SASL bundle
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        rm -rf cyrus
        mkdir cyrus
        asset="cyrus-sasl-${{ inputs.cyrus-version }}-${{ inputs.cyrus-revision }}-${{ inputs.platform }}.tar.gz"
        gh release download "${{ inputs.cyrus-tag }}" --repo '${{ github.repository }}' -p "$asset"
        tar -xzf "$asset" -C cyrus

    - name: Install OpenSSL on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: vcpkg install openssl:x64-windows

    - name: Install OpenSSL on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: brew install openssl@3

    - name: Configure Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake -S . -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="${{ inputs.install-prefix }}" `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DBUILD_WITH_QT6=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=ON `
          -DBUILD_PLUGINS="ossl;cyrus-sasl" `
          -DSasl2_ROOT="$pwd/cyrus" -DSASL2_USE_STATIC_LIBS=ON

    - name: Configure macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="${{ inputs.install-prefix }}" \
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
          -DOSX_FRAMEWORK=OFF \
          -DBUILD_WITH_QT6=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=ON \
          -DBUILD_PLUGINS='ossl;cyrus-sasl' \
          -DSasl2_ROOT="$PWD/cyrus" -DSASL2_USE_STATIC_LIBS=ON

    - name: Build QCA
      shell: bash
      run: cmake --build build --config Release
